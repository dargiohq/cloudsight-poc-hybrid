name: Deploy Oracle POC

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ORACLE_HOST: 129.213.111.220
  ORACLE_USER: ubuntu
  REPO_NAME: cloudsight-poc-hybrid
  ARCHIVE_NAME: cloudsight-poc-hybrid.tar.gz

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: oracle-poc-deploy
      cancel-in-progress: true

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create source archive
        run: git archive --format=tar.gz --output "/tmp/${ARCHIVE_NAME}" HEAD

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          cat <<'EOF' > ~/.ssh/oracle_deploy_key
          ${{ secrets.ORACLE_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/oracle_deploy_key
          ssh-keyscan -H "${ORACLE_HOST}" >> ~/.ssh/known_hosts

      - name: Upload source bundle
        run: |
          scp -i ~/.ssh/oracle_deploy_key "/tmp/${ARCHIVE_NAME}" \
            "${ORACLE_USER}@${ORACLE_HOST}:/tmp/${ARCHIVE_NAME}"

      - name: Deploy POC on Oracle
        run: |
          ssh -i ~/.ssh/oracle_deploy_key "${ORACLE_USER}@${ORACLE_HOST}" <<'EOF'
          set -euo pipefail
          flock -w 1800 /tmp/cloudsight-oracle-deploy.lock bash -lc '
            set -euo pipefail
            ROOT=/opt/cloudsight
            REPO=cloudsight-poc-hybrid
            ARCHIVE=/tmp/cloudsight-poc-hybrid.tar.gz
            STAGE=$(mktemp -d /tmp/cloudsight-poc-hybrid.XXXXXX)

            mkdir -p "$ROOT/$REPO"
            tar -xzf "$ARCHIVE" -C "$STAGE"
            rsync -a --delete "$STAGE"/ "$ROOT/$REPO"/
            rm -rf "$STAGE" "$ARCHIVE"

            cd "$ROOT/oracle-cloudsight-stack"
            docker compose build cloudsight-poc-hybrid
            docker compose up -d cloudsight-poc-hybrid
            docker compose ps cloudsight-poc-hybrid
          '
          EOF

      - name: Verify POC page
        run: |
          curl --retry 12 --retry-delay 5 --retry-all-errors \
            --fail --silent --show-error \
            "https://poc.cloudsight.dargio.in/console.html" | grep -q "Multi-cloud test playground"
