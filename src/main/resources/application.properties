spring.application.name=cloudsight-poc-hybrid
server.port=${PORT:9092}

cloudsight.api.base-url=${CLOUDSIGHT_API_BASE_URL:https://dargio-cloudsight-backend.onrender.com}
cloudsight.workspace.email=${CLOUDSIGHT_WORKSPACE_EMAIL:test@dargio.com}
cloudsight.workspace.password=${CLOUDSIGHT_WORKSPACE_PASSWORD:password123}
cloudsight.collector.aws-url=${CLOUDSIGHT_COLLECTOR_AWS_URL:https://cloudsight-collector-aws.onrender.com}
cloudsight.collector.gcp-url=${CLOUDSIGHT_COLLECTOR_GCP_URL:https://cloudsight-collector-gcp.onrender.com}
cloudsight.collector.azure-url=${CLOUDSIGHT_COLLECTOR_AZURE_URL:https://cloudsight-collector-azure.onrender.com}
cloudsight.collector.openai-url=${CLOUDSIGHT_COLLECTOR_OPENAI_URL:https://cloudsight-collector-openai.onrender.com}

cloudsight.live.aws.region=${CLOUDSIGHT_LIVE_AWS_REGION:ap-south-1}
cloudsight.live.aws.bucket=${CLOUDSIGHT_LIVE_AWS_BUCKET:}
cloudsight.live.aws.access-key-id=${CLOUDSIGHT_LIVE_AWS_ACCESS_KEY_ID:}
cloudsight.live.aws.secret-access-key=${CLOUDSIGHT_LIVE_AWS_SECRET_ACCESS_KEY:}
cloudsight.live.aws.session-token=${CLOUDSIGHT_LIVE_AWS_SESSION_TOKEN:}

cloudsight.live.gcp.bucket=${CLOUDSIGHT_LIVE_GCP_BUCKET:}
cloudsight.live.gcp.service-account-json=${CLOUDSIGHT_LIVE_GCP_SERVICE_ACCOUNT_JSON:}

cloudsight.live.azure.blob-container-sas-url=${CLOUDSIGHT_LIVE_AZURE_BLOB_CONTAINER_SAS_URL:}

cloudsight.live.openai.api-key=${CLOUDSIGHT_LIVE_OPENAI_API_KEY:}
cloudsight.live.openai.model=${CLOUDSIGHT_LIVE_OPENAI_MODEL:gpt-4.1-mini}
